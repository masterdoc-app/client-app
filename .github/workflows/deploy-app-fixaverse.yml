name: Deploy app.fixaverse.ru

on:
  push:
    branches: [main, trunk]
  workflow_dispatch:

concurrency:
  group: deploy-app-fixaverse-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_HOST: 91.207.75.72
  DEPLOY_PATH: /opt/fixaverse-app
  WEB_ROOT: /var/www/app.fixaverse.ru
  SITE_HOST: app.fixaverse.ru

jobs:
  build:
    name: Build composeApp Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: chmod +x gradlew

      - name: Build distribution
        env:
          FIXAVERSE_OIDC_WEB_CLIENT_ID: ${{ secrets.FIXAVERSE_OIDC_WEB_CLIENT_ID }}
        run: |
          ./gradlew \
            :auth:jvmTest \
            :shared:jvmTest \
            :composeApp:wasmJsBrowserDistribution \
            --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 3

  deploy:
    name: Deploy to app.fixaverse.ru
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: dist-app/

      - name: Verify deploy secrets
        env:
          KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$KEY" || { echo "Add repository secret DEPLOY_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$USER_NAME" || { echo "Add repository secret DEPLOY_USER"; exit 1; }

      - name: Load SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_ed25519
          chmod 600 ~/.ssh/deploy_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare directories on server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p ${DEPLOY_PATH} ${WEB_ROOT}"

      - name: Rsync app
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_ed25519 -o IdentitiesOnly=yes" \
            dist-app/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${WEB_ROOT}/"

      - name: Rsync nginx config and install script
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -avz \
            -e "ssh -i $HOME/.ssh/deploy_ed25519 -o IdentitiesOnly=yes" \
            deploy/app.fixaverse.ru.nginx.conf \
            deploy/app.fixaverse.ru.nginx.http.conf \
            deploy/install-app-fixaverse-nginx.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Install nginx site and TLS
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        run: |
          ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x ${DEPLOY_PATH}/install-app-fixaverse-nginx.sh && \
             DEPLOY_PATH='${DEPLOY_PATH}' CERTBOT_EMAIL='${CERTBOT_EMAIL:-admin@fixaverse.ru}' \
             SITE_HOST='${SITE_HOST}' \
             ${DEPLOY_PATH}/install-app-fixaverse-nginx.sh"

      - name: Smoke
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'set -euo pipefail
             code=$(curl -fsS -o /tmp/app-index.html -w "%{http_code}" https://'"${SITE_HOST}"'/)
             echo "HTTP $code"
             grep -F "src=\"/composeApp.js\"" /tmp/app-index.html
             curl -fsS -o /dev/null -w "js=%{http_code}\n" https://'"${SITE_HOST}"'/composeApp.js'

