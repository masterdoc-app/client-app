# app.fixaverse.ru — HTTP bootstrap (before certbot)
server {
    listen 80;
    listen [::]:80;
    server_name app.fixaverse.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /technolog {
        return 301 /;
    }

    location ^~ /technolog/ {
        return 301 /;
    }

    location / {
        root /var/www/app.fixaverse.ru;
        try_files $uri $uri/ /index.html;
    }
}
