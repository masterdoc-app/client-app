# app.fixaverse.ru — HTTP bootstrap (before certbot)
server {
    listen 80;
    listen [::]:80;
    server_name app.fixaverse.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /technolog {
        return 301 /;
    }

    location ^~ /technolog/ {
        return 301 /;
    }

    location = / {
        root /var/www/app.fixaverse.ru;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        root /var/www/app.fixaverse.ru;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.wasm$ {
        root /var/www/app.fixaverse.ru;
        types { application/wasm wasm; }
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs)$ {
        root /var/www/app.fixaverse.ru;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        root /var/www/app.fixaverse.ru;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        root /var/www/app.fixaverse.ru;
        default_type text/html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
