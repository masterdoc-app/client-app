# app.fixaverse.ru — portal (/) + role SPAs (/technolog/, …)
# Certs: certbot certonly --webroot -w /var/www/certbot -d app.fixaverse.ru

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.fixaverse.ru;

    ssl_certificate /etc/letsencrypt/live/app.fixaverse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.fixaverse.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Keep full mime map; do NOT replace with a tiny `types {}` block
    # (that makes extensionless `/` → application/octet-stream → browser download).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/wasm application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /technolog {
        return 301 /technolog/;
    }

    # ^~ keeps assets under this tree
    location ^~ /technolog/ {
        root /var/www/app.fixaverse.ru;
        try_files $uri $uri/ /technolog/index.html;
    }

    location = /index.html {
        root /var/www/app.fixaverse.ru/portal;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    location = /technolog/index.html {
        root /var/www/app.fixaverse.ru;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /var/www/app.fixaverse.ru/portal;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
