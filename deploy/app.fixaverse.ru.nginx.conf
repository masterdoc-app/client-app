# app.fixaverse.ru — single feature shell (Wasm)
# Certs: certbot certonly --webroot -w /var/www/certbot -d app.fixaverse.ru

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.fixaverse.ru;

    ssl_certificate /etc/letsencrypt/live/app.fixaverse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.fixaverse.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Keep full mime map; do NOT replace with a tiny `types {}` block
    # (that makes extensionless `/` → application/octet-stream → browser download).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/wasm application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Legacy role-app paths → single shell
    location = /technolog {
        return 301 /;
    }

    location ^~ /technolog/ {
        return 301 /;
    }

    # HTML entry — always revalidate (stable URL, content changes every deploy)
    location = / {
        root /var/www/app.fixaverse.ru;
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        root /var/www/app.fixaverse.ru;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    # Content-hashed Wasm (e.g. 2333e86f….wasm, skiko hash) — immutable long cache.
    # Do NOT fall back to index.html (that poisoned missing .wasm with HTML).
    location ~* \.wasm$ {
        root /var/www/app.fixaverse.ru;
        types { application/wasm wasm; }
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Shell JS keeps a stable name (composeApp.js) — must revalidate after deploy.
    location ~* \.(?:js|mjs)$ {
        root /var/www/app.fixaverse.ru;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Brand images — short public cache is fine
    location ^~ /assets/ {
        root /var/www/app.fixaverse.ru;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        root /var/www/app.fixaverse.ru;
        default_type text/html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
