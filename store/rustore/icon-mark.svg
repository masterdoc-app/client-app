    <!-- bottom arm -->
    <path d="M160 300 C130 320, 125 360, 165 385 C210 415, 300 420, 360 395"
          stroke="url(#g)" stroke-width="64"/>
  </g>

  <!-- end nodes -->
  <circle cx="390" cy="200" r="18" fill="#0A0E16" stroke="#EAF4FF" stroke-width="8"/>
  <circle cx="155" cy="395" r="18" fill="#0A0E16" stroke="#EAF4FF" stroke-width="8"/>
