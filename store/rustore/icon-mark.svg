<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="60" y1="140" x2="450" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#79C4FF"/>
      <stop offset="40%" stop-color="#3B9EFF"/>
      <stop offset="100%" stop-color="#1F6FD0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0A0E16"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#2F6AAE" stroke-width="3" opacity="0.7"/>

  <!-- S-ribbon: three runs with round caps (brand mark from logo-fixaverse) -->
